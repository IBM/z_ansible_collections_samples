name: ansible-lint
on: [push, pull_request] # noqa: yaml[truthy]

permissions:
  contents: read

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install "ansible-lint==6.9.1" "ansible-core==2.18.9" "ansible-compat==2.2.7"

      - name: Install dependencies from Ansible Galaxy
        run: |
          for attempt in 1 2 3; do
            echo "Galaxy install attempt $attempt of 3..."
            ansible-galaxy collection install -r collections/requirements.yml \
              --timeout 60 \
              -p "${{ github.workspace }}/.collections" && break
            if [[ $attempt -lt 3 ]]; then
              echo "Attempt $attempt failed, retrying in 30s..."
              sleep 30
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      # Equivalent local one-liner (for reference / local testing):
      # for dir in /Users/ddimatos/git/z_ansible_collections_samples/*/; do echo "=== Entering: $dir ===" && (cd "$dir" && ansible-lint *); done
      - name: Run ansible-lint
        env:
          ANSIBLE_LIBRARY: "${{ github.workspace }}/zos_subsystems/ims/ims_provisioning/library"
          ANSIBLE_COLLECTIONS_PATHS: "${{ github.workspace }}/.collections"
        run: |
          failed=()
          for dir in ${{ github.workspace }}/*/; do
            echo ""
            echo "==============================================="
            echo "  Entering: $dir"
            echo "==============================================="
            echo ""
            if (cd "$dir" && ansible-lint *); then
              echo "[PASS] $dir"
            else
              echo "[FAIL] $dir"
              failed+=("$dir")
            fi
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo ""
            echo "The following directories failed:"
            for d in "${failed[@]}"; do
              echo "  - $d"
            done
            exit 1
          fi
