###############################################################################
# This sample playbook demonstrates how to perform encoding conversions on USS
# using modules included in the IBM z/OS core collection.
#
# Usage:
#  ansible-playbook -i <inventory> <playbook>
#
# Example:
#  ansible-playbook -i inventories convert_encoding.yml
#
#  When running this playbook, review the comments on how ths sample will
#  interact with your target, ensure you have the required authority and
#  permissions such as writing the the target directories or creating data sets.
#
#  Additional facts for this playbook can be configured to override the defaults
#  by reviewing the "Fact setting" section of this playbook, for example,
#  `system_name`.
#
# Requirements:
#   IBM z/OS core collection 2.0.0 or later
#
# Configure:
#   tgt_tmp_dir - this is the USS directory on the target which will be written
#                 to for this example.
#   ctl_tmp_dir - this is the directory on the controller which will be written
#                 to for this example.
# Optional:
#   system_name - this is the system name that will be used during this example,
#                 determined by executing `uname -n` on the target.
###############################################################################

---
- name: Convert file encodings on USS
  hosts: zos_host
  gather_facts: false
  vars:
    tgt_tmp_dir: "/tmp"
    ctl_tmp_dir: "/tmp"
  environment: "{{ environment_vars }}"

  tasks:
    # ##########################################################################
    # Fact setting for use by this playbook
    # ##########################################################################
    - name: Detecting system name
      ansible.builtin.command: uname -n
      register: result
      changed_when: false

    - name: Setting fact `system_name` for use by this sample
      ansible.builtin.set_fact:
        system_name: "{{ result.stdout }}"

    - name: Fact `system_name` set with value
      ansible.builtin.debug:
        msg: "{{ system_name }}"

    # ##########################################################################
    # Modules zos_encode
    # ##########################################################################
    # +-------------------------------------------------------------------------
    # | Create shell script on target, encode with the targets charset, execute
    # | script if mode == 755, else fail
    # +-------------------------------------------------------------------------
    - name: "{{ 'Create shell script %s/date.sh on target %s' | format(tgt_tmp_dir, inventory_hostname) }}"
      ansible.builtin.copy:
        dest: "{{ tgt_tmp_dir }}/date.sh"
        content: |
          date
        owner: "{{ ansible_user }}"
        mode: "0755"
        force: true

    - name: Detect character set for locale on target {{ inventory_hostname }}
      ansible.builtin.command: locale -c charmap
      register: result
      changed_when: false

    - name: "{{ 'Response for create shell script %s/date.sh on target %s' | format(tgt_tmp_dir, inventory_hostname) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: Set variable `target_charset` with the target charset of {{ inventory_hostname }}
      ansible.builtin.set_fact:
        target_charset: "{{ result.stdout | default('IBM-1047') }}"

    - name: "{{ 'Encode script %s/date.sh encoding from ISO8859-1 to \"%s\"' | format(tgt_tmp_dir, target_charset) }}"
      ibm.ibm_zos_core.zos_encode:
        src: "{{ tgt_tmp_dir }}/date.sh"
        dest: "{{ tgt_tmp_dir }}/date.sh"
        encoding:
          from: ISO8859-1
          to: "{{ target_charset }}"
        backup: false
      register: result

    - name: "{{ 'Response for encode script %s/date.sh encoding from ISO8859-1 to %s' | format(tgt_tmp_dir, target_charset) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"
    - name: Setting fact `script_sh_mode` with script file permissions
      ansible.builtin.set_fact:
        script_sh_mode: "{{ result.mode }}"

    - name: Display script contents after changing encoding to "{{ target_charset }}"
      ansible.builtin.command: cat {{ tgt_tmp_dir }}/date.sh
      register: result
      changed_when: false

    - name: Response for display script contents after changing encoding
        to "{{ target_charset }}"
      ansible.builtin.debug:
        msg: "{{ result.stdout }}"

    - name: "{{ 'Executing %s/date.sh on target if permission is 0755' | format(tgt_tmp_dir) }}"
      ansible.builtin.command: "{{ tgt_tmp_dir }}/date.sh"
      register: result
      when: script_sh_mode == "0755"
      changed_when: false

    - name: "{{ 'Response for executing %s/date.sh on target if permission is 0755' | format(tgt_tmp_dir) }}"
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines }}"
      when: result.stdout_lines is defined

    - name: File permissions check
      ansible.builtin.fail:
        msg: "File {{ tgt_tmp_dir }}/date.sh permissions were not equal to 0755"
      when: result.stdout_lines is not defined
      register: permissions_check
      ignore_errors: true

    - name: "{{ 'Remove %s/date.sh on target %s' | format(tgt_tmp_dir, inventory_hostname) }}"
      ansible.builtin.file:
        path: "{{ tgt_tmp_dir }}/date.sh"
        state: absent
      register: result

    - name: "{{ 'Response for remove %s/date.sh on target %s' | format(tgt_tmp_dir, inventory_hostname) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"

    # +-------------------------------------------------------------------------
    # | Create 4 files on USS target, encode them and and delete them
    # +-------------------------------------------------------------------------

    - name: Detecting the character set for the locale on the target
      ansible.builtin.command: locale -c charmap
      register: result
      changed_when: false

    - name: Response for detecting the character set for the locale on the
        target
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: Set variable `target_charset` with the target charset of {{ inventory_hostname }}
      ansible.builtin.set_fact:
        target_charset: "{{ result.stdout | default('IBM-1047') }}"

    - name: "{{ 'Create directory %s/encode/' | format(tgt_tmp_dir) }}"
      ansible.builtin.file:
        path: "{{ tgt_tmp_dir }}/encode/"
        state: directory
        mode: "0755"

    - name: "{{ 'Create a series of USS files in %s/encode' | format(tgt_tmp_dir) }}"
      ansible.builtin.file:
        path: "{{ tgt_tmp_dir }}/encode/{{ item }}.txt"
        state: touch
        mode: "0644"
      with_sequence: count=4
      register: result

    - name: "{{ 'Response for create a series of USS files in %s/encode' | format(tgt_tmp_dir) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: '{{ "Populate a series of USS files in %s/encode with ''hello world''" | format(tgt_tmp_dir) }}'
      ansible.builtin.shell: 'echo "hello world" >{{ tgt_tmp_dir }}/encode/{{ item }}.txt'
      with_sequence: count=4
      register: result
      changed_when: true

    - name: '{{ "Response for populate a series of USS files in %s/encode with ''hello world''" | format(tgt_tmp_dir) }}'
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: "{{ 'Encode files in %s/encode/ from charset ISO8859-1 to %s' | format(tgt_tmp_dir, target_charset) }}"
      ibm.ibm_zos_core.zos_encode:
        src: "{{ tgt_tmp_dir }}/encode/"
        dest: "{{ tgt_tmp_dir }}/encode/"
        encoding:
          from: ISO8859-1
          to: "{{ target_charset }}"
      register: result

    - name: "{{ 'Response for encode files in %s/encode/ from charset ISO8859-1 to %s' | format(tgt_tmp_dir, target_charset) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"

    # +----------------------------------------------------------------------------------------------------------
    # | The display method below requires the Ansible controller to be able to process EBCDIC data.
    # | You should comment out the display and response tasks if your controller is unable to process EBCDIC.
    # +----------------------------------------------------------------------------------------------------------
    # - name: Display a series of USS files contents in {{ tgt_tmp_dir }}/encode
    #   ansible.builtin.command: "cat {{ tgt_tmp_dir }}/encode/{{ item }}.txt"
    #   with_sequence: count=4
    #   register: result

    - name: "{{ 'Response for display a series of USS files contents in %s/encode' | format(tgt_tmp_dir) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"

    - name: "{{ 'Remove files on target in %s/encode' | format(tgt_tmp_dir) }}"
      ansible.builtin.file:
        path: "{{ tgt_tmp_dir }}/encode"
        state: absent
      register: result

    - name: "{{ 'Response for remove files on target in %s/encode' | format(tgt_tmp_dir) }}"
      ansible.builtin.debug:
        msg: "{{ result }}"
