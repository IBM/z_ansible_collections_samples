###############################################################################
# Requirements:
#     - IBM z/OS core collection 2.0.0 or later
###############################################################################

- name: Query the SMP/E CSI
  hosts: zos_host
  gather_facts: false
  environment: "{{ environment_vars }}"

  roles:
    - role: query_csi
      query_csi_ptf: "UI70435"
      query_csi_global_csi: "IMSTESTL.ZOAU100.CSI"
      query_csi_zone: GLOBAL
      query_csi_list_operands: "SYSMOD({{ query_csi_ptf }}) HOLDDATA ."
