# tasks file for query_csi

# LIST HOLDDATA
- name: "{{ 'LIST %s FROM ZONE %s' | format(query_csi_list_operands, query_csi_zone) }}"
  ibm.ibm_zos_core.zos_mvs_raw:
    pgm: GIMSMP
    auth: "yes"
    dds:
      - dd_data_set:
          dd_name: "SMPCSI"
          data_set_name: "{{ query_csi_global_csi }}"

      - dd_output:
          dd_name: "SMPOUT"
          return_content:
            type: text
      - dd_output:
          dd_name: "SMPLIST"
          return_content:
            type: text
      - dd_input:
          dd_name: "SMPCNTL"
          content:
            - 'SET  BOUNDARY({{ query_csi_zone }}) .'
            - 'LIST {{ query_csi_list_operands }}'
