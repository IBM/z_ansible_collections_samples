# Required Python packages:
#
# ansible
# openstackclient
# openstacksdk
# netaddr

# The Image Registry Operator is not initially available for platforms that do not provide default storage.
# We set the image registry to an empty directory for non-production clusters.

- name: 'Check the image registry service status'
  ansible.builtin.shell: |
    set -o pipefail
    ./oc --kubeconfig auth/kubeconfig get service -n openshift-image-registry | grep image-registry | wc -l
  args:
    executable: /bin/bash
  register: service_status
  changed_when: false

- name: 'Set the image registry storage to an empty directory'
  ansible.builtin.command:
    cmd: >-
      ./oc --kubeconfig auth/kubeconfig patch configs.imageregistry.operator.openshift.io cluster
      --type merge --patch '{"spec":{"storage":{"emptyDir":{}}}}'
  changed_when: false
  when:
    - service_status.stdout == "2"

- name: 'Set the image registry to managed to enable building and pushing of images'
  ansible.builtin.command:
    cmd: >-
      ./oc --kubeconfig auth/kubeconfig patch configs.imageregistry.operator.openshift.io cluster
      --type merge --patch '{"spec":{"managementState": "Managed"}}'
  changed_when: false
  when:
    - service_status.stdout == "2"

- name: 'Expose the image registry'
  ansible.builtin.command:
    cmd: >-
      ./oc --kubeconfig auth/kubeconfig patch configs.imageregistry.operator.openshift.io cluster
      --type merge --patch '{"spec":{"defaultRoute":true}}'
  changed_when: false
